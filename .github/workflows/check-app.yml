name: Check Gepuzzellig

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-app:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
      - name: Node instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: App controleren
        run: node .github/scripts/check-app.mjs
      - name: Opslag en UX-regressies controleren
        run: node .github/scripts/check-ux.mjs
      - name: Tikken en Pencil-bediening controleren
        run: node .github/scripts/check-input.mjs
      - name: Automatische kruisjes controleren
        run: node .github/scripts/check-autocross.mjs
      - name: Stapsgewijze hints controleren
        run: node .github/scripts/check-hints.mjs
      - name: Puzzelspecifieke hintafleidingen controleren
        run: node .github/scripts/check-hint-guidance.mjs
      - name: Murdoku-oplossingen en bestaande voortgang controleren
        run: node .github/scripts/check-murdoku.mjs
      - name: Binair-moeilijkheid en compatibiliteit controleren
        run: node .github/scripts/check-binair.mjs
      - name: Hexcells-combinatiestappen en compatibiliteit controleren
        run: node .github/scripts/check-hexcells.mjs
