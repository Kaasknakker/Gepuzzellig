name: Check Gepuzzellig

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check-app:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
      - name: Node instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Java 21 instellen voor Firestore-emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Firestore-rules testafhankelijkheden installeren
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Fase 2 Firestore-rules controleren
        run: npm run test:rules
      - name: Fase 4 migratie controleren
        run: node .github/scripts/check-phase4-migration.mjs
      - name: Fase 5 membershipmigratie controleren
        run: node .github/scripts/check-phase5-migration.mjs
      - name: Fase 5 appcontract controleren
        run: node .github/scripts/check-phase5-app.mjs
      - name: Fase 6 Functions-veiligheid controleren
        run: node .github/scripts/check-phase6-functions.mjs
      - name: Fase 7 appcontract controleren
        run: node .github/scripts/check-phase7-app.mjs
      - name: Fase 7 voorkeurmigratie controleren
        run: node .github/scripts/check-phase7-migration.mjs
      - name: Functions syntax controleren
        run: node --check functions/index.js
      - name: Client syntax controleren
        run: |
          node --check js/puzzle-registry.js
          node --check js/core.js
          node --check js/firebase.js
      - name: App controleren
        run: node .github/scripts/check-app.mjs
      - name: Puzzelregistratie controleren
        run: node .github/scripts/check-puzzle-registry.mjs
      - name: Opslag en UX-regressies controleren
        run: node .github/scripts/check-ux.mjs
      - name: Tikken en Pencil-bediening controleren
        run: node .github/scripts/check-input.mjs
      - name: Pluszle dubbeltik controleren
        run: node .github/scripts/check-pluszle-doubletap.mjs
      - name: Afrondingsdag en resultaatidentiteit controleren
        run: node .github/scripts/check-completion.mjs
      - name: Automatische kruisjes controleren
        run: node .github/scripts/check-autocross.mjs
      - name: Stapsgewijze hints controleren
        run: node .github/scripts/check-hints.mjs
      - name: Puzzelspecifieke hintafleidingen controleren
        run: node .github/scripts/check-hint-guidance.mjs
      - name: Korte hintpresentatie en uitklappen controleren
        run: node .github/scripts/check-hint-presentation.mjs
      - name: Murdoku-oplossingen en bestaande voortgang controleren
        run: node .github/scripts/check-murdoku.mjs
      - name: Binair-moeilijkheid en compatibiliteit controleren
        run: node .github/scripts/check-binair.mjs
      - name: Hexcells-combinatiestappen en compatibiliteit controleren
        run: node .github/scripts/check-hexcells.mjs
