name: Deploy Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production invitation mail function safely
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Guard production configuration
        run: |
          test "$GITHUB_REF_NAME" = "main"
          grep -q '"runtime": "nodejs22"' firebase.json
          grep -q '"node": "22"' functions/package.json
          node .github/scripts/check-phase6-functions.mjs
          node --check functions/index.js
      - name: Authenticate to production Firebase project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEPUZZELIG }}
          project_id: gepuzzelig
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install function dependencies
        run: npm install --prefix functions --omit=dev --no-audit --no-fund
      - name: Write production Functions parameters
        run: |
          cat > functions/.env.gepuzzelig <<'EOF'
          APP_URL=https://kaasknakker.github.io/Gepuzzellig/
          MAIL_MODE=postmark
          MAIL_ALLOWLIST=
          EOF
          grep -q '^MAIL_MODE=postmark$' functions/.env.gepuzzelig
          grep -q '^APP_URL=https://kaasknakker.github.io/Gepuzzellig/$' functions/.env.gepuzzelig
      - name: Verify production target
        run: |
          test "$(gcloud config get-value project)" = "gepuzzelig"
      - name: Deploy only Functions to production
        run: npx --yes firebase-tools@15.34.1 deploy --only functions --project gepuzzelig --non-interactive
