name: Deploy Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy invitation mail function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEPUZZELIG }}
          project_id: gepuzzelig

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install function dependencies
        run: npm install --prefix functions --omit=dev

      - name: Deploy Firebase Functions
        run: npx --yes firebase-tools@15.34.1 deploy --only functions --project gepuzzelig --non-interactive
