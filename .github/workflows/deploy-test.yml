name: Deploy Gepuzzellig Test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gepuzzellig-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy isolated test environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 21 instellen voor Firestore-emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Firestore-rules testafhankelijkheden installeren
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Fase 2 Firestore-rules controleren
        run: npm run test:rules

      - name: Run app checks
        run: |
          node .github/scripts/check-app.mjs
          node .github/scripts/check-puzzle-registry.mjs
          node .github/scripts/check-ux.mjs
          node .github/scripts/check-input.mjs
          node .github/scripts/check-pluszle-doubletap.mjs
          node .github/scripts/check-completion.mjs
          node .github/scripts/check-autocross.mjs
          node .github/scripts/check-hints.mjs
          node .github/scripts/check-hint-guidance.mjs
          node .github/scripts/check-hint-presentation.mjs
          node .github/scripts/check-murdoku.mjs
          node .github/scripts/check-binair.mjs
          node .github/scripts/check-hexcells.mjs

      - name: Build test-only hosting directory
        run: |
          mkdir -p .test-dist
          rsync -a ./ .test-dist/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.test-dist/' \
            --exclude 'docs/' \
            --exclude 'functions/' \
            --exclude 'node_modules/' \
            --exclude 'firebase.json' \
            --exclude 'firebase.test.json' \
            --exclude '.firebaserc' \
            --exclude 'firestore.rules' \
            --exclude 'FIREBASE_DEPLOY.md' \
            --exclude 'FUNCTIONS_SETUP.md'
          cp js/config.test.js .test-dist/js/config.js
          rm -f .test-dist/js/config.test.js
          grep -q 'projectId:"gepuzzellig-test"' .test-dist/js/config.js
          ! grep -q 'projectId:"gepuzzelig"' .test-dist/js/config.js

      - name: Authenticate to test Firebase project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEPUZZELLIG_TEST }}
          project_id: gepuzzellig-test

      - name: Google Cloud CLI instellen
        uses: google-github-actions/setup-gcloud@v3

      - name: Anonymous Authentication alleen in test inschakelen
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/gepuzzellig-test/config?updateMask=signIn.anonymous.enabled" \
            -d '{"signIn":{"anonymous":{"enabled":true}}}'

      - name: Deploy test rules and Hosting
        run: npx --yes firebase-tools@15.34.1 deploy --only firestore:rules,hosting --config firebase.test.json --project gepuzzellig-test --non-interactive
