name: Deploy Gepuzzellig Test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gepuzzellig-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy isolated test environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Java 21 instellen voor Firestore-emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Firestore-rules testafhankelijkheden installeren
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Fase 2 Firestore-rules controleren
        run: npm run test:rules

      - name: Client syntax controleren
        run: |
          node --check js/puzzle-registry.js
          node --check js/core.js
          node --check js/firebase.js
      - name: App controleren
        run: node .github/scripts/check-app.mjs
      - name: Puzzelregistratie controleren
        run: node .github/scripts/check-puzzle-registry.mjs
      - name: Opslag en UX-regressies controleren
        run: node .github/scripts/check-ux.mjs
      - name: Tikken en Pencil-bediening controleren
        run: node .github/scripts/check-input.mjs
      - name: Pluszle dubbeltik controleren
        run: node .github/scripts/check-pluszle-doubletap.mjs
      - name: Afrondingsdag en resultaatidentiteit controleren
        run: node .github/scripts/check-completion.mjs
      - name: Automatische kruisjes controleren
        run: node .github/scripts/check-autocross.mjs
      - name: Stapsgewijze hints controleren
        run: node .github/scripts/check-hints.mjs
      - name: Puzzelspecifieke hintafleidingen controleren
        run: node .github/scripts/check-hint-guidance.mjs
      - name: Korte hintpresentatie en uitklappen controleren
        run: node .github/scripts/check-hint-presentation.mjs
      - name: Murdoku controleren
        run: node .github/scripts/check-murdoku.mjs
      - name: Binair controleren
        run: node .github/scripts/check-binair.mjs
      - name: Hexcells controleren
        run: node .github/scripts/check-hexcells.mjs
      - name: Fase 4 migratie controleren
        run: node .github/scripts/check-phase4-migration.mjs
      - name: Fase 5 migratie controleren
        run: node .github/scripts/check-phase5-migration.mjs
      - name: Fase 6 Functions controleren
        run: node .github/scripts/check-phase6-functions.mjs
      - name: Fase 7 app controleren
        run: node .github/scripts/check-phase7-app.mjs
      - name: Fase 7 migratie controleren
        run: node .github/scripts/check-phase7-migration.mjs
      - name: Fase 8 app controleren
        run: node .github/scripts/check-phase8-app.mjs

      - name: Build test-only hosting directory
        run: |
          mkdir -p .test-dist
          rsync -a ./ .test-dist/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.test-dist/' \
            --exclude 'docs/' \
            --exclude 'functions/' \
            --exclude 'node_modules/' \
            --exclude 'firebase.json' \
            --exclude 'firebase.test.json' \
            --exclude '.firebaserc' \
            --exclude 'firestore.rules' \
            --exclude 'FIREBASE_DEPLOY.md' \
            --exclude 'FUNCTIONS_SETUP.md'
          cp js/config.test.js .test-dist/js/config.js
          rm -f .test-dist/js/config.test.js
          grep -q 'projectId:"gepuzzellig-test"' .test-dist/js/config.js
          ! grep -q 'projectId:"gepuzzelig"' .test-dist/js/config.js

      - name: Authenticate to test Firebase project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEPUZZELLIG_TEST }}
          project_id: gepuzzellig-test

      - name: Google Cloud CLI instellen
        uses: google-github-actions/setup-gcloud@v3

      - name: Seed Fase 8 testgroepen
        if: contains(github.event.head_commit.message, '[seed-test-groups]')
        env:
          GOOGLE_CLOUD_PROJECT: gepuzzellig-test
        run: node scripts/seed-test-groups.mjs

      - name: Anonymous Authentication alleen in test inschakelen
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/gepuzzellig-test/config?updateMask=signIn.anonymous.enabled" \
            -d '{"signIn":{"anonymous":{"enabled":true}}}'

      - name: Deploy test rules and Hosting
        run: npx --yes firebase-tools@15.34.1 deploy --only firestore:rules,hosting --config firebase.test.json --project gepuzzellig-test --non-interactive
