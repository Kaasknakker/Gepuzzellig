name: Deploy Gepuzzellig Test Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy test Functions safely
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Guard develop and test-only configuration
        run: |
          test "$GITHUB_REF_NAME" = "develop"
          test "${{ github.event.repository.default_branch }}" = "main"
          grep -q 'gepuzzellig-test' .github/scripts/check-phase6-functions.mjs
          node .github/scripts/check-phase6-functions.mjs
          node --check functions/index.js
          grep -q '"runtime": "nodejs22"' firebase.json
          grep -q '"node": "22"' functions/package.json

      - name: Authenticate to test Firebase project
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEPUZZELLIG_TEST }}
          project_id: gepuzzellig-test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install function dependencies
        run: npm install --prefix functions --omit=dev --no-audit --no-fund

      - name: Write test-only Functions parameters
        run: |
          cat > functions/.env.gepuzzellig-test <<'EOF'
          APP_URL=https://gepuzzellig-test.web.app/
          MAIL_MODE=sink
          MAIL_ALLOWLIST=
          EOF
          grep -q '^MAIL_MODE=sink$' functions/.env.gepuzzellig-test
          ! grep -q 'kaasknakker.github.io' functions/.env.gepuzzellig-test

      - name: Verify target before runtime update
        run: |
          test "$(gcloud config get-value project)" = "gepuzzellig-test"
          test "$(gcloud functions describe sendInviteEmail --gen2 --region=europe-west1 --project=gepuzzellig-test --format='value(name)')" = "projects/gepuzzellig-test/locations/europe-west1/functions/sendInviteEmail"

      - name: Update test Function runtime to Node 22
        run: |
          gcloud functions deploy sendInviteEmail \
            --gen2 \
            --region=europe-west1 \
            --project=gepuzzellig-test \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=sendInviteEmail \
            --trigger-http \
            --no-allow-unauthenticated \
            --quiet

      - name: Verify deployed runtime
        run: |
          test "$(gcloud functions describe sendInviteEmail --gen2 --region=europe-west1 --project=gepuzzellig-test --format='value(buildConfig.runtime)')" = "nodejs22"

      - name: Deploy only Functions to test
        run: npx --yes firebase-tools@15.34.1 deploy --only functions --project gepuzzellig-test --non-interactive --force
