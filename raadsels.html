<script>
/* ===== Rekenraadsels: sjablonen met willekeurige getallen, rekenend terug vanaf een mooi antwoord ===== */
const RR=(seed)=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const shuf=(a,R)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const rint=(R,a,b)=>a+Math.floor(R()*(b-a+1)),rpick=(R,a)=>a[Math.floor(R()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const nl=(x,dec)=>{const neg=x<0;x=Math.abs(x);let s=dec!=null?x.toFixed(dec):String(Math.round(x*1000)/1000);let[i,f]=s.split(".");i=i.replace(/\B(?=(\d{3})+(?!\d))/g,".");return(neg?"-":"")+i+(f?","+f:"")};
const eur=x=>"€ "+(Number.isInteger(x)?nl(x):nl(x,2));
/* Uitleg met meerdere manieren: uitwerking is een rijtje stappen, of een rijtje van rijtjes (manieren onder elkaar, met OF ertussen).
   Een stap is tekst, of {t:tekst, tabel:{kop:[…], rijen:[[…]]}} voor een tabelletje. */
const ts=(t,kop,rijen)=>({t,tabel:{kop,rijen}});
function uitlegBouw(uw,u){
 (Array.isArray(u[0])?u:[u]).forEach((stappen,i)=>{
  if(i){const of=document.createElement("div");of.className="of";of.textContent="OF";uw.append(of)}
  const ol=document.createElement("ol");
  stappen.forEach(st=>{const li=document.createElement("li");
   if(typeof st==="string")li.textContent=st;
   else{li.append(document.createTextNode(st.t));const w=document.createElement("div"),tb=document.createElement("table"),hr=document.createElement("tr");w.className="utab";
    st.tabel.kop.forEach(k=>{const c=document.createElement("th");c.textContent=k;hr.append(c)});tb.append(hr);
    st.tabel.rijen.forEach(r=>{const tr=document.createElement("tr");r.forEach(v=>{const c=document.createElement("td");c.textContent=v;tr.append(c)});tb.append(tr)});w.append(tb);li.append(w)}
   ol.append(li)});
  uw.append(ol)})}
const NEUT_M=["Jan","Kees","Willem","Gert","Bas","Ruud","Henk","Joost","Pieter","Marco"],NEUT_V=["Hetty","Femke","Sanne","Lotte","Ineke","Mieke","Anouk","Joke","Marloes","Esther"];
/* De familie: volwassenen voor de meeste verhalen, kleinkinderen en honden waar het past. */
const MANNEN=["Aart","Sijmon","Martijn","Jeroen","Thomas","Peter"],VROUWEN=["Lisa","Iris","Iwona","Lieke","Ingrid","Renske"],KLEIN=["Jan","Feliks","Daan","Olaf","Lars","Emma"],HONDEN=["Marsha","Dora"];
let LASTNM="";const nm=R=>(LASTNM=R()<.5?rpick(R,MANNEN):rpick(R,VROUWEN));const hz=()=>VROUWEN.includes(LASTNM)?"ze":"hij",HZ=()=>VROUWEN.includes(LASTNM)?"Ze":"Hij";

{id:"wissel",naam:"Wisselkoersen",gen(R){

 const C=[];for(let k=3;k<=6;k++)for(let d=1;d<=3;d++)for(let m=2;m<k;m++){const t=d*k*(k-1)/2;if(t%(k-m))continue;const o=t/(k-m),y=o-d*(k-1),F=m*o;if(y>=1&&F>=26&&F<=60)C.push({k,d,m,o,F})}

{id:"moeder",naam:"Moeder en dochter",gen(R){
 for(;;){const D=rint(R,6,25),M=rint(R,25,55),x=M-2*D;if(x<1||x>30)continue;const ks=[];for(let k=3;k<=8;k++){const y=(k*D-M)/(k-1);if(Number.isInteger(y)&&y>0&&D-y>=1)ks.push([k,y])}if(!ks.length)continue;const[k,y]=rpick(R,ks);

   uitwerking:[[`Uit de eerste zin: m = 2d + ${x}.`,`Uit de tweede: m = ${k}d − ${k*y-y}.`,`Dus 2d + ${x} = ${k}d − ${k*y-y}, ${k-2}d = ${x+k*y-y}, d = ${D}.`,`${mo} is 2 × ${D} + ${x} = ${M} jaar.`],[`Gok de leeftijd van ${do_}. Uit de eerste zin volgt de leeftijd van ${mo}: ze is nu 2 × ${do_} + ${x}.`,ts(`Controleer de tweede zin en stel de gok bij.`,["Dochter nu","Moeder nu",`Moeder ${y} jaar geleden`,`${k} × dochter toen`,""],[D+4,D+2,D].map(d=>{const m=2*d+x;return[d,m,m-y,k*(d-y),m-y>k*(d-y)?"te oud":m-y<k*(d-y)?"te jong":"klopt"]})),`Bij ${D} jaar klopt het: ${do_} is ${D} en ${mo} is ${M}.`],[`Het leeftijdsverschil tussen ${mo} en ${do_} blijft altijd hetzelfde.`,`Over ${x} jaar is ${mo} twee keer zo oud als ${do_}. Dan is het verschil precies zo groot als de leeftijd van ${do_} dan: ${do_} nu + ${x}.`,`${y} jaar geleden was ${mo} ${k} keer zo oud. Dan is het verschil ${k-1} keer de leeftijd van ${do_} toen: ${k-1} × (${do_} nu − ${y}).`,`Dus ${do_} + ${x} = ${k-1} × ${do_} − ${(k-1)*y}. Dan is ${k-2} × ${do_} = ${x} + ${(k-1)*y} = ${x+(k-1)*y}, dus ${do_} is ${D}.`,`${mo} is 2 × ${D} + ${x} = ${M}.`]]}}}},
{id:"schilderen",naam:"Samen klussen",gen(R){
 for(;;){const a=rint(R,2,9),b=rint(R,2,12);if(a===b)continue;const solo=rint(R,1,a-1)||0;if(solo<1)continue;

  return{tekst:`${A} doet er in zijn eentje ${a} uur over om ${klus}. ${B} kan het alleen in ${b} uur. ${A} begint om 9:00 uur alleen. Na ${solo} uur komt ${B} helpen en werken ze samen verder tot de klus af is.`,

   uitwerking:[[`Na ${solo} uur is ${solo}/${a} af, er is nog ${a-solo}/${a} over.`,`Samen per uur: 1/${a} + 1/${b} = ${a+b}/${a*b}.`,`Tijd samen: ${a-solo}/${a} : ${a+b}/${a*b} = ${(a-solo)*b}/${a+b} uur = ${nl(tog*60)} minuten.`,`9:00 + ${solo} uur + ${nl(tog*60)} minuten = ${tijd(9*60+totmin)}.`],[`Maak de klus ${a*b/gcd(a,b)} stukjes groot. Dat is handig, want ${a} en ${b} gaan er allebei precies in.`,`${A} doet ${a*b/gcd(a,b)} : ${a} = ${b/gcd(a,b)} stukjes per uur, ${B} doet ${a*b/gcd(a,b)} : ${b} = ${a/gcd(a,b)} stukjes per uur.`,`Na ${solo} uur heeft ${A} ${solo} × ${b/gcd(a,b)} = ${solo*b/gcd(a,b)} stukjes gedaan. Er zijn er nog ${a*b/gcd(a,b)} − ${solo*b/gcd(a,b)} = ${a*b/gcd(a,b)-solo*b/gcd(a,b)}.`,`Samen doen ze ${b/gcd(a,b)} + ${a/gcd(a,b)} = ${(a+b)/gcd(a,b)} stukjes per uur. Dat kost ${a*b/gcd(a,b)-solo*b/gcd(a,b)} : ${(a+b)/gcd(a,b)} uur = ${nl(tog*60)} minuten.`,`9:00 + ${solo} uur + ${nl(tog*60)} minuten = ${tijd(9*60+totmin)}.`]]}}}},

{id:"belichting",naam:"Belichting van een foto",gen(R){

{id:"lindor",naam:"Een zak Lindor verdelen",gen(R){

 for(;;){const a=rint(R,20,50),b=rint(R,12,a-2);const N=a*b,E=2*a+2*b-4;if(N<300||N>2000)continue;const v=R()<.5,foto=rpick(R,["de Brandaris","een Lindt-chocolaterie","een stoomtrein op een brug","de duinen van Terschelling"]);
  return{tekst:`Een rechthoekige legpuzzel met een foto van ${foto} bestaat uit ${nl(N)} stukjes in een net rooster van rijen en kolommen. ${nl(E)} daarvan zijn randstukjes (met minstens één rechte kant).`,

{id:"veerboot",naam:"Veerboot en sneldienst",gen(R){
 for(;;){const[v1,v2]=rpick(R,[[20,40],[20,60],[30,60],[24,60],[20,30],[24,40],[30,40]]),m=v2/v1,X=rint(R,10,60),Y=rint(R,5,50);if(!Number.isInteger(v2))continue;
  /* D/v1 - D/v2 = (X+Y)/60 */const D=(X+Y)/60/(1/v1-1/v2);if(!Number.isInteger(D)||D<20||D>35)continue;const start=rint(R,90,200)*5;
  return{tekst:`Om ${tijd(start)} vertrekt de veerboot van Harlingen naar West-Terschelling. Hij vaart gemiddeld ${v1} km/u. De sneldienst vertrekt ${X} minuten later van dezelfde kade en vaart gemiddeld ${nl(m)} keer zo snel. Toch komt de sneldienst ${Y} minuten eerder aan dan de veerboot.`,

{id:"peper",naam:"123 peper",gen(R){
 for(;;){const g=rint(R,10,25)*10,x=rint(R,2,5),y=rint(R,x+2,10),sd=rint(R,0,6);let cum=0,day=0;while(cum<g){const wd=(sd+day)%7;cum+=wd>=5?y:x;day++}
  const W=5*x+2*y,full=Math.floor(g/W);if(full<2||g===full*W)continue;const wie=rpick(R,["Aart","Opa Aart"]);
  return{tekst:`${wie} is gek op 123 peper en strooit het over werkelijk alles. Een nieuwe strooibus bevat ${g} gram. Op werkdagen gebruikt ${wie.toLowerCase()==="vader"?"hij":"hij"} ${x} gram per dag. In het weekend, als er uitgebreid gekookt wordt, is het ${y} gram per dag.\nOp ${DAGEN[sd]} opent ${wie==="Opa Aart"?"opa Aart":wie} een nieuwe bus.`,
   vraag:`De bus raakt leeg op dag ….. (de dag van openen is dag 1).`,eenheid:"",ans:day,
   hints:[`Hoeveel peper gaat er in een hele week doorheen? Dat is altijd hetzelfde, op welke dag je ook begint.`,`Een week: 5 × ${x} + 2 × ${y} = ${W} gram. Na ${full} hele weken (${full*7} dagen) is er ${full*W} gram op en nog ${g-full*W} gram over.`],
   uitwerking:[`Per week: 5 × ${x} + 2 × ${y} = ${W} gram.`,`${full} hele weken = ${full*7} dagen, samen ${full*W} gram. Er is nog ${g-full*W} gram over, en dag ${full*7+1} is weer een ${DAGEN[sd]}.`,`Daarna dag voor dag: ${(()=>{let c=full*W,o=[];for(let d=full*7;d<day;d++){const wd=(sd+d)%7;c+=wd>=5?y:x;o.push(DAGEN[wd]+" "+Math.min(c,g)+" g")}return o.join(", ")})()}. De bus is leeg op dag ${day}.`]}}}},
{id:"tegenliggers",naam:"Tegenliggers tellen",gen(R){
 const ST=[["Zwolle","Groningen"],["Leeuwarden","Groningen"],["Amersfoort","Zwolle"],["Utrecht","Zwolle"],["Zwolle","Enschede"]];
 for(;;){const f=rpick(R,[10,15,20,30]),T=rint(R,8,30)*5,a=rint(R,0,f-1),b=rint(R,0,f-1),t0=420+a+rint(R,2,20)*f;
  const dep=[];for(let d=240+b;d<1440;d+=f)dep.push(d);if(dep.some(d=>d===t0-T||d===t0+T))continue;const meet=dep.filter(d=>d>t0-T&&d<t0+T);if(meet.length<4)continue;const[A,B]=rpick(R,ST);
  const mins=[];for(let m=b;m<60;m+=f)mins.push(m);const ml=mins.length>1?mins.slice(0,-1).join(", ")+" en "+mins[mins.length-1]:mins[0];
  return{tekst:`Tussen ${A} en ${B} rijden de hele dag treinen in beide richtingen. Een rit duurt precies ${T} minuten, ook in de andere richting.\nUit ${B} vertrekt een trein om ${ml} minuten over elk heel uur.\nJij stapt in ${A} in de trein van ${tijd(t0)} naar ${B}. Onderweg zie je treinen uit ${B} voorbijkomen. Treinen die je alleen op een station ziet staan tellen niet mee.`,
   vraag:`Onderweg kom je ….. treinen uit ${B} tegen.`,eenheid:"treinen",ans:meet.length,
   hints:[`Vergeet de treinen niet die al onderweg zijn als jij vertrekt. Welke trein uit ${B} is de eerste die je tegenkomt?`,`Een trein uit ${B} kom je tegen als hij vertrekt na ${tijd(t0-T)} (anders is hij al in ${A} voor jij vertrekt) en voor ${tijd(t0+T)} (dan ben jij in ${B}).`],
   uitwerking:[`Jij rijdt van ${tijd(t0)} tot ${tijd(t0+T)}.`,`Je ziet elke trein uit ${B} die vertrekt na ${tijd(t0-T)} en vóór ${tijd(t0+T)}.`,`Dat zijn de treinen van ${meet.map(tijd).join(", ")}: ${meet.length} treinen.`]}}}},
{id:"overgang",naam:"Spoorwegovergang",gen(R){
 for(;;){const v1=rpick(R,[20,25,30,35,40]),k1=rint(R,4,16),L1=v1*k1,a=rint(R,15,40),b=rint(R,4,12),twee=R()<.65;if(L1<80||L1>500)continue;
  let tot=a+k1+b,txt2="",v2=0,k2=0,L2=0,c=0;
  if(twee){v2=rpick(R,[20,25,30,35]);k2=rint(R,3,10);L2=v2*k2;c=rint(R,10,k1+b+a-2);if(L2<60||c-a>k1+b||c<=0)continue;tot=Math.max(k1+b,c+k2+b)+a;if(c+k2+b<=k1+b)continue;
   txt2=`\n${c} seconden nadat de intercity de overgang bereikt, komt uit de andere richting een sprinter van ${L2} meter aan, met ${nl(v2*3.6)} km/u. Omdat die al aankomt voordat de bomen open zouden gaan, blijven ze dicht.`}
  return{tekst:`Bij een spoorwegovergang gaan de bomen ${a} seconden voordat een trein de overgang bereikt dicht. Ze gaan pas ${b} seconden nadat de laatste wagon de overgang voorbij is weer open.\nEen intercity van ${L1} meter lang rijdt met ${nl(v1*3.6)} km/u over de overgang.${txt2}`,
   vraag:`De bomen zijn in totaal ….. seconden dicht.`,eenheid:"seconden",ans:tot,
   hints:[`Reken de snelheid om naar meter per seconde (deel door 3,6). Hoe lang duurt het voordat de hele trein de overgang voorbij is?`,`${nl(v1*3.6)} km/u = ${v1} m/s. De intercity is na ${L1} : ${v1} = ${k1} seconden helemaal voorbij.${twee?` De sprinter: ${nl(v2*3.6)} km/u = ${v2} m/s, ${L2} : ${v2} = ${k2} seconden.`:""}`],
   uitwerking:twee?[`Neem t = 0 als de intercity de overgang bereikt. Dicht vanaf t = −${a}.`,`Intercity voorbij op t = ${k1}. Sprinter bereikt de overgang op t = ${c} en is voorbij op t = ${c} + ${k2} = ${c+k2}.`,`Laatste trein voorbij op t = ${Math.max(k1,c+k2)}, bomen open op t = ${Math.max(k1,c+k2)+b}.`,`Dicht van −${a} tot ${Math.max(k1,c+k2)+b}: ${tot} seconden.`]:[`${nl(v1*3.6)} km/u = ${v1} m/s.`,`De trein is na ${L1} : ${v1} = ${k1} seconden voorbij.`,`${a} + ${k1} + ${b} = ${tot} seconden.`]}}}},
{id:"treinstellen",naam:"Treinstellen koppelen",gen(R){
 for(;;){const s=rint(R,17,26)*10,g=rint(R,30,44)*10,x0=rint(R,1,4),y0=rint(R,1,4),N=x0*s+y0*g;if(g<=s+60)continue;
  const sol=[];for(let y=0;y*g<=N;y++){const r=N-y*g;if(r%s===0)sol.push([r/s,y])}const mn=Math.min(...sol.map(q=>q[0]+q[1])),best=sol.filter(q=>q[0]+q[1]===mn);if(best.length!==1)continue;
  const gy=Math.floor(N/g);if((N-gy*g)%s===0)continue;const[bx,by]=best[0];if(!bx||!by)continue;
  return{tekst:`Voor een drukke zaterdag moet een trein precies ${nl(N)} zitplaatsen hebben, niet meer en niet minder. Er zijn korte treinstellen met ${s} zitplaatsen en lange treinstellen met ${g} zitplaatsen. Je kunt er zoveel aan elkaar koppelen als je wilt.`,

   uitwerking:[...sol.slice(0,4).map(([x,y])=>`${y} lang (${nl(y*g)}) + ${x} kort (${nl(x*s)}) = ${nl(N)}: ${x+y} treinstellen.`),`Minimaal: ${by} lange en ${bx} korte = ${mn} treinstellen.`]}}}},
{id:"megapixels",naam:"Foto afdrukken",gen(R){

{id:"panorama",naam:"Panoramafoto",gen(R){

{id:"palindroom",naam:"De kilometerteller",gen(R){
 const pal=x=>{const s=String(x);return s===s.split("").reverse().join("")};
 /* Meestal vijf cijfers (abcba), soms zes (abccba). In bijna de helft van de tellers staat een 9 in het midden;
    dan is het volgende spiegelgetal 110 of 11 km verder in plaats van 100 (zes cijfers: 1100). */
 const tel=()=>{const zes=rint(R,1,100)<=25,a=rint(R,1,9),b=rint(R,0,9),c=rint(R,1,100)<=45?9:rint(R,0,8);return+(zes?""+a+b+c+c+b+a:""+a+b+c+b+a)};
 const SNEL=[30,40,45,50,55,60,70,75,80,90,100,110,120];
 const kies=()=>{for(let g=0;g<500;g++){const P=tel();let Q=P+1;while(!pal(Q))Q++;const d=Q-P,lang=d>=1000,v=rpick(R,SNEL),m=d*60/v;
   if(!Number.isInteger(m)||m<(lang?480:5)||m>(lang?960:150)||(d>=100&&m%5))continue;return[P,Q,d,v,m]}return null};
 const[P,Q,d,v,m]=kies()||[12321,12421,100,60,100];
 const s=String(P),n=s.length,c9=s[2]==="9",b9=s[1]==="9",
  midden=n===5?"het middelste cijfer":"de twee middelste cijfers",ernaast=n===5?"het cijfer ernaast":"de cijfers ernaast",

 const auto=rpick(R,["Dacia Sandero","Dacia Duster","Dacia Jogger"]),dur=m%60?(m>60?`${Math.floor(m/60)} uur en ${m%60} minuten`:`${m} minuten`):`${m/60} uur`;
 return{tekst:`Op de kilometerteller van de ${auto} staat ${nl(P)}. Dat getal lees je van voor naar achter en van achter naar voor hetzelfde. Na precies ${dur} rijden ziet ${nm(R)} dat er wéér zo'n getal op de teller staat: het eerstvolgende.`,
   vraag:`De gemiddelde snelheid was ….. km/u.`,eenheid:"km/u",ans:v,
   hints:[`Wat is het eerstvolgende getal na ${nl(P)} dat van achter naar voor hetzelfde is? ${tip}`,`Dat is ${nl(Q)}. Er is dus ${nl(d)} km gereden.`],

{id:"banden",naam:"Banden rouleren",gen(R){

{id:"reep",naam:"Reep breken",gen(R){

 return{tekst:`${nm(R)} breekt een reep chocolade van ${a} bij ${b} blokjes${twee?` en daarna nog een kleinere reep van ${c} bij ${d} blokjes`:""} in losse blokjes. Bij elke keer breken pak je één stuk en breek je het langs een rechte lijn in twee stukken. Stukken op elkaar leggen mag niet.`,

{id:"cacao",naam:"Cacao mengen",gen(R){

   uitwerking:[[`Nodig: ${t}% van ${nl(M)} = ${nl(M*t/100)} g cacao.`,`Alles ${c1}%: ${nl(M*c1/100)} g. Tekort: ${nl(M*(t-c1)/100)} g.`,`Per gram ${c2}% in plaats van ${c1}%: ${nl((c2-c1)/100)} g extra. ${nl(M*(t-c1)/100)} : ${nl((c2-c1)/100)} = ${nl(M-x)} g van de ${c2}%.`,`Van de ${c1}%: ${nl(M)} − ${nl(M-x)} = ${nl(x)} g.`],[`${t}% ligt ${t-c1} boven ${c1}% en ${c2-t} onder ${c2}%.`,`Hoe dichter bij een soort, hoe meer je ervan nodig hebt. De verhouding ${c1}%-soort : ${c2}%-soort is dus ${c2-t} : ${t-c1}.`,`Samen zijn dat ${c2-t} + ${t-c1} = ${c2-c1} delen. Van de ${c1}%-soort neem je ${c2-t} van de ${c2-c1} delen: ${nl(M)} × ${c2-t} : ${c2-c1} = ${nl(x)} g.`,`De rest is de ${c2}%-soort: ${nl(M)} − ${nl(x)} = ${nl(M-x)} g.`]]}}}},
{id:"aanbieding",naam:"Welke aanbieding?",gen(R){

 const fb=(g,s)=>{let b=0,c=0;for(let i=0;i<3;i++){if(g[i]===s[i])b++;else if(s.includes(g[i]))c++}return[b,c]};
 const all=[];for(let a=0;a<10;a++)for(let b=0;b<10;b++)for(let c=0;c<10;c++)if(a!==b&&b!==c&&a!==c)all.push(""+a+b+c);
 const T={"0,0":"geen enkel cijfer goed","1,0":"één cijfer goed en op de goede plek","0,1":"één cijfer goed, maar op de verkeerde plek","0,2":"twee cijfers goed, maar allebei op de verkeerde plek","1,1":"twee cijfers goed: één op de goede plek en één op de verkeerde plek","2,0":"twee cijfers goed en op de goede plek","0,3":"alle drie de cijfers goed, maar allemaal op de verkeerde plek"};
 for(;;){const sec=all[rint(R,0,all.length-1)],G=[];let cand=all.slice();
  for(let k=0;k<12&&cand.length>1;k++){const g=all[rint(R,0,all.length-1)],f=fb(g,sec);if(g===sec||f[0]===2&&R()<.7||f[1]===3||(f[0]+f[1]===0&&G.some(x=>x.f[0]+x.f[1]===0)))continue;const nc=cand.filter(x=>fb(g,x).join()===f.join());if(nc.length===cand.length)continue;G.push({g,f});cand=nc}
  if(cand.length!==1)continue;
  for(const x of G.slice()){const t=G.filter(y=>y!==x);const c=all.filter(s=>t.every(y=>fb(y.g,s).join()===y.f.join()));if(c.length===1)G.splice(G.indexOf(x),1)}
  if(G.length<4||G.length>6)continue;const n=nm(R),sp=sec.split("");
  return{tekst:`${n} is de code van het fietsslot vergeten. Het is een code van 3 verschillende cijfers. ${HZ()} weet nog een paar pogingen, en wat daaraan klopte:\n${G.map(x=>`• ${x.g}: ${T[x.f.join()]}.`).join("\n")}`,

function raadCheck(q,inp){inp=String(inp??"").trim();if(!inp)return null;
 if(q.soort==="keuze")return inp===q.ans;
 /* undefined betekent een ongeldige schrijfwijze, geen inhoudelijk fout antwoord. */
 if(q.soort==="code")return /^\d+$/.test(inp)?inp===q.ans:undefined;
 if(q.soort==="tijd"){const m=inp.match(/^(\d{1,2})(?:[:.]|\s+)?(\d{2})$/);if(!m||+m[1]>23||+m[2]>59)return undefined;return tijd(+m[1]*60+ +m[2])===q.ans}
 let s=inp.replace(/\u2212/g,"-").replace(/[\u00a0\u202f]/g," ");
 if(s.startsWith("€"))s=s.slice(1).trim();else if(s.endsWith("€"))s=s.slice(0,-1).trim();
 /* Nederlandse duizendtallen en decimale komma; een decimale punt mag ook.
    Een punt met precies drie cijfers erachter blijft een duizendtalscheiding. */
 if(/^[+-]?(?:\d{1,3}(?:[.]\d{3})+|\d{1,3}(?: \d{3})+)(?:,\d+)?$/.test(s))s=s.replace(/[. ]/g,"").replace(",",".");
 else if(/^[+-]?(?:\d+(?:,\d+)?|,\d+)$/.test(s))s=s.replace(",",".");
 else if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(s))return undefined;
 const v=Number(s);if(!Number.isFinite(v))return undefined;return Math.abs(v-q.ans)<(q.tol||1e-6)+1e-9}

{id:"dobbelvlak",naam:"Dobbelstenen op tafel",lvl:"2F",gen(R){
